# WebSocket upgrade handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mobopos.test api.mobopos.test panel.mobopos.test phpmyadmin.mobopos.test mailpit.mobopos.test;
    return 301 https://$server_name$request_uri;
}

# HTTPS Configuration for mobopos.test (Frontend)
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mobopos.test;

    # SSL certificate paths (using mkcert)
    ssl_certificate /etc/nginx/certs/mkcert/mobopos.test.pem;
    ssl_certificate_key /etc/nginx/certs/mkcert/mobopos.test-key.pem;
    include /etc/nginx/conf.d/ssl.conf;

    # WebSocket handling
    location ~ ^/(app|apps) {
        proxy_pass http://adminapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}

# HTTPS Configuration for API (api.mobopos.test)
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api.mobopos.test;

    ssl_certificate /etc/nginx/certs/mkcert/api.mobopos.test.pem;
    ssl_certificate_key /etc/nginx/certs/mkcert/api.mobopos.test-key.pem;
    include /etc/nginx/conf.d/ssl.conf;

    # API with versioning support
    location ~ ^/v\d+/ {
        limit_except GET POST PUT DELETE OPTIONS PATCH {
            deny all;
        }
        rewrite ^(/v\d+)/(.*)$ /api$1/$2 break;
        proxy_pass http://adminapp:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Non-versioned API calls
    location / {
        limit_except GET POST PUT DELETE OPTIONS PATCH {
            deny all;
        }
        rewrite ^/(.*)$ /api/$1 break;
        proxy_pass http://adminapp:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block access to sensitive files
    location ~ \.(env|log|gitignore|htaccess|htpasswd|ini|phar|pem|key)$ {
        deny all;
    }
}

# HTTPS Configuration for Filament Admin (panel.mobopos.test)
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name admin.mobopos.test;

    ssl_certificate /etc/nginx/certs/mkcert/panel.mobopos.test.pem;
    ssl_certificate_key /etc/nginx/certs/mkcert/panel.mobopos.test-key.pem;
    include /etc/nginx/conf.d/ssl.conf;

    # WebSocket handling for adminapp
    location ~ ^/(app|apps) {
        proxy_pass http://adminapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Proxy to adminapp Filament Admin Panel
    location / {
        proxy_pass http://adminapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

