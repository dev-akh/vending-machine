# Nginx server block for the frontend, WebSocket, and API routing
server {
    listen 80;
    listen [::]:80;
    
    # Frontend
    server_name vone.local;

    # WebSocket handling for Reverb (app)
    location ~ ^/(app|apps) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host; 
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
        proxy_read_timeout 120;
    }

    # Laravel Admin Panel served from app:8000
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
        proxy_read_timeout 120;
    }

     # Block access to sensitive files (e.g., .env, .gitignore)
    location ~ \.(env|env.example|log|gitignore|htaccess|htpasswd|ini|phar|pem|key)$ {
        deny all;
    }
}

